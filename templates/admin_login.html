{% extends "base.html" %}
{% block title %}Admin sign in{% endblock %}
{% block content %}
<section class="card narrow">
    <h1>Admin sign in</h1>
    <p class="muted">Only authorised staff can review reports and update their status.</p>
    <form method="POST">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autofocus>
        <button type="submit" class="btn full">Sign in</button>
    </form>
</section>
{% endblock %}
